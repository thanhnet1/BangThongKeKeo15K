<!DOCTYPE html>
<html lang="vi">
<head>
    <!-- Nhúng Meta, Tiêu đề & Thư viện từ thư mục modules -->
    <div id="inc-head"></div>
    <script>
        fetch('modules/head-meta.html').then(r => r.text()).then(d => document.getElementById('inc-head').innerHTML = d);
    </script>

    <!-- Nhúng toàn bộ CSS định dạng từ thư mục modules -->
    <div id="inc-css"></div>
    <script>
        fetch('modules/css-styles.html').then(r => r.text()).then(d => document.getElementById('inc-css').innerHTML = d);
    </script>
</head>
<body>
    <div class="container">
        <div class="hero-banner"></div>
        
        <!-- Nhúng Header, Menu điều hướng & Modal -->
        <div id="inc-header"></div>
        <script>
            fetch('modules/header-nav.html').then(r => r.text()).then(d => document.getElementById('inc-header').innerHTML = d);
        </script>

        <!-- Vùng hiển thị nội dung các tab động -->
        <div id="tabContent"></div>
    </div>

    <!-- THỨ TỰ NHÚNG SCRIPT CHUẨN XÁC TỪ THƯ MỤC MODULES -->
    <script src="modules/mod-core.js"></script>
    <script src="modules/mod-pickthu.js"></script>
    <script src="modules/mod-admin.js"></script>
    <script src="modules/mod-home.js"></script>
    <script src="modules/mod-setting.js"></script>
    <script src="modules/mod-tonghop.js"></script>
    <script src="modules/mod-minigame-common.js"></script>
    <script src="modules/mod-minigame1.js"></script>
    <script src="modules/mod-minigame2.js"></script>
    <script src="modules/mod-firebase.js"></script> <!-- Đặt cuối cùng để khởi tạo dữ liệu sau khi các hàm đã sẵn sàng -->
</body>
</html>
