<!DOCTYPE html>
<html lang="vi">
<head>
    <!-- Nhúng Meta, Tiêu đề & Thư viện -->
    <div id="inc-head"></div>
    <script>
        fetch('head-meta.html').then(r => r.text()).then(d => document.getElementById('inc-head').innerHTML = d);
    </script>

    <!-- Nhúng toàn bộ CSS định dạng -->
    <div id="inc-css"></div>
    <script>
        fetch('css-styles.html').then(r => r.text()).then(d => document.getElementById('inc-css').innerHTML = d);
    </script>
</head>
<body>
    <div class="container">
        <div class="hero-banner"></div>
        
        <!-- Nhúng Header, Menu điều hướng & Modal -->
        <div id="inc-header"></div>
        <script>
            fetch('header-nav.html').then(r => r.text()).then(d => document.getElementById('inc-header').innerHTML = d);
        </script>

        <!-- Vùng hiển thị nội dung các tab động -->
        <div id="tabContent"></div>
    </div>

    <!-- Nhúng toàn bộ Logic JavaScript theo từng Module -->
    <script src="mod-core.js"></script>
    <script src="mod-admin.js"></script>
    <script src="mod-pickthu.js"></script>
    <script src="mod-home.js"></script>
    <script src="mod-setting.js"></script>
    <script src="mod-tonghop.js"></script>
    <script src="mod-minigame-common.js"></script>
    <script src="mod-minigame1.js"></script>
    <script src="mod-minigame2.js"></script>
    <script src="mod-firebase.js"></script> <!-- Thêm dòng này -->
</body>
</html>
