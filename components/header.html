<!-- ==========================================================================
   COMPONENT: components/header.html — Khung đầu trang chuẩn gọn gàng
   ========================================================================== -->
<!-- [PART: layout] -->
<div class="header-section" style="background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.15); color: white; padding: 12px 14px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15); margin-bottom: 14px; display: flex; flex-direction: column; gap: 10px; position: relative; z-index: 500;">
  
  <!-- Hàng trên: Logo, Tên CLB, Trạng thái Cloud và Nút Admin -->
  <div class="header-top" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
    <div class="brand-title" style="display: flex; align-items: center; gap: 10px;">
      <img src="logo1.png" alt="Logo CMTD" class="title-logo-img" style="max-height: 45px; width: auto; object-fit: contain; filter: drop-shadow(0px 2px 6px rgba(0,0,0,0.4));">
      <h2 style="margin: 0; font-weight: 900; color: #fff; font-size: 16px; letter-spacing: 0.5px;">CLB PICKLEBALL - CMTD</h2>
    </div>
    
    <div style="display: flex; align-items: center; gap: 8px; margin-left: auto;">
      {{admin_button}}
      {{cloud_status}}
    </div>
  </div> 

  <!-- Hàng dưới: Thanh điều hướng các nút được căn chỉnh thẳng hàng, không bị lộn xộn -->
  <div class="top-nav" style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 8px; position: relative;">
    {{nav}}
  </div>

</div>

<!-- Vùng chứa nội dung các tab chuyển đổi -->
<div id="tabContent"></div>
<!-- [/PART] -->
