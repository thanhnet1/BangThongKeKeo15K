<!-- [PART: players.modal] -->
<div id="player-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-[9999] p-4">
  <div class="bg-white rounded-xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-200">
    <div class="bg-gradient-to-r from-slate-900 to-slate-800 text-white px-5 py-4 flex justify-between items-center">
      <h3 id="modal-title" class="font-bold text-sm uppercase tracking-wider">Thêm Pick Thủ Mới</h3>
      <button onclick="closePlayerModal()" class="text-slate-400 hover:text-white transition-colors text-lg font-bold px-2">&times;</button>
    </div>
    <div class="p-6 space-y-4">
      <input type="hidden" id="player-id">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Tên Pick Thủ</label>
        <input type="text" id="player-name" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs font-semibold focus:outline-none focus:border-blue-600" placeholder="Nhập tên VĐV...">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Giới Tính</label>
        <select id="player-gender" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs font-semibold focus:outline-none focus:border-blue-600 bg-white">
          <option value="Nam">Nam</option>
          <option value="Nữ">Nữ</option>
        </select>
      </div>
      <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
        <button onclick="closePlayerModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-xs font-bold transition-colors">Hủy</button>
        <button onclick="savePlayer()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold transition-colors shadow-sm">Lưu Lại</button>
      </div>
    </div>
  </div>
</div>
<!-- [/PART] -->

<!-- [PART: keo-select] -->
<select onchange="{{onChangeFuncStr}}(this.value)" class="text-[11px] font-bold px-2 py-1 rounded bg-slate-800 text-white border border-slate-700 focus:outline-none cursor-pointer">
  <option value="default" {{selected_currentMode_default}}>Kèo: Thắng +5 | Thua -15</option>
  <option value="k25" {{selected_currentMode_k25}}>Kèo: Thua -25</option>
  <option value="no_keo" {{selected_currentMode_no_keo}}>Không tính tiền kèo</option>
  <option value="free" {{selected_currentMode_free}}>Kèo tùy chỉnh mệnh giá</option>
</select>
<!-- [/PART] -->
