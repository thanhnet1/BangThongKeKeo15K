<!-- [PART: dates-menu-item] -->
<button onclick="switchTab('{{d}}')" class="w-full text-left px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-100 rounded-lg transition {{if_currentTab_d_class}}">
  📅 Ngày {{d}}
</button>
<!-- [/PART] -->

<!-- [PART: tab-head-div-1] -->
<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 text-center text-slate-500 text-xs">
  Chưa có dữ liệu ngày thi đấu hoặc chưa có ngày nào được chuyển về quỹ.
</div>
<!-- [/PART] -->

<!-- [PART: tab-head] -->
<div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden font-sans">
  <div class="px-3 py-2.5 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
    <h3 class="text-xs sm:text-sm font-bold text-slate-800 uppercase tracking-wide flex items-center gap-1.5">
      <i class="fa-solid fa-chart-line text-emerald-600"></i> BẢNG TỔNG HỢP TẤT CẢ CÁC NGÀY (ĐÃ CHUYỂN VỀ QUỸ)
    </h3>
  </div>
  <div class="overflow-x-auto scrollbar-thin">
    <table class="w-full text-center border-collapse min-w-[700px] text-[11px] sm:text-xs">
      <thead>
        <tr class="bg-slate-100 text-slate-700 uppercase font-bold border-b border-slate-200">
          <th class="py-2.5 px-2 text-left border-r border-slate-200 sticky left-0 bg-slate-100 z-10 w-36">PICK THỦ</th>
          {{activeDates_rows}}
          <th class="py-2.5 px-2 border-l border-slate-200 bg-slate-900 text-white font-extrabold">TỔNG CỘNG</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-200">
<!-- [/PART] -->

<!-- [PART: tab-head-tr-1] -->
        <tr class="hover:bg-slate-50 transition">
          <td class="py-2 px-2 font-bold text-left border-r border-slate-200 sticky left-0 bg-white z-10 truncate" style="color: {{vdvColor}};" title="{{v}}">{{v}}</td>
          {{{dayCells}}}
          <td class="py-2 px-2 font-black border-l border-slate-200 {{totalCls}}">{{rowSum_text}}</td>
        </tr>
<!-- [/PART] -->

<!-- [PART: tab-head-td-1] -->
          <td class="py-2.5 px-2 font-bold {{cls}}">{{val_text}}</td>
<!-- [/PART] -->

<!-- [PART: tab-head-tr-2] -->
        <tr class="bg-slate-50 font-black text-xs sm:text-sm border-t-2 border-slate-300">
          <td class="py-3 px-2 text-left border-r border-slate-200 sticky left-0 bg-slate-50 z-10 uppercase text-slate-800">TỔNG QUỸ NGÀY</td>
          {{{daySumCells}}}
          <td class="py-3 px-2 border-l border-slate-200 {{grandTotalCls}}">{{grandTotalAllDays_text}}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<!-- [/PART] -->

<!-- [PART: nav] -->
<div class="relative group">
  <button onclick="switchTab('tonghop')" class="w-full flex items-center justify-between px-3 py-2 text-xs font-bold text-slate-700 hover:bg-slate-100 rounded-lg transition">
    <span class="flex items-center gap-2"><i class="fa-solid fa-table-cells text-indigo-600"></i> Tổng Hợp Các Ngày</span>
  </button>
</div>
<!-- [/PART] -->
