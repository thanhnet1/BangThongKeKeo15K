     COMPONENT: components/common.html — DÙNG CHUNG: hộp thoại thể lệ Mini Game + ô chọn loại kèo.
     Mỗi PART nằm giữa dòng chú thích "[PART: tên]" và dòng chú thích "[/PART]" (HTML được giữ nguyên từng ký tự).
     {{tên_slot}} là chỗ js/main.js điền dữ liệu (số liệu, hàng của bảng...). Sửa chữ/màu/bố cục thoải mái;
     chỉ cần giữ nguyên các {{tên_slot}} (không đổi tên, không xóa nếu vẫn muốn hiện dữ liệu đó).

<!-- từ hàm renderKeoSelectDropdown() · slots: onChangeFuncStr, selected_currentMode_default, selected_currentMode_k25, selected_currentMode_no_keo, selected_currentMode_free -->
<!-- [PART: keo-select] -->

        <select style="width: auto; padding: 4px 8px; font-weight: bold; background: #fff8e1; border: 1px solid #d97706;" onchange="{{onChangeFuncStr}}(this.value)">
          <option value="default" {{selected_currentMode_default}}>Kèo 5k / -15k (Mặc định)</option>
          <option value="k25" {{selected_currentMode_k25}}>Kèo 25k (0k / -25k)</option>
          <option value="no_keo" {{selected_currentMode_no_keo}}>No Kèo (0k / 0k)</option>
          <option value="free" {{selected_currentMode_free}}>Kèo Tự Do (Tùy Chỉnh)</option>
        </select>
      
<!-- [/PART] -->

<!-- [PART: game-modal] -->

  <!-- MODAL CHỈNH SỬA MINI GAME -->
  <div class="modal" id="gameModal">
    <div class="modal-content">
      <h3 style="margin-top:0; font-size:14px; font-weight:800;" id="gameModalTitle">Chỉnh Sửa Mini Game</h3>
      <textarea id="gameContentInput" rows="5" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; font-size:11px;" placeholder="Nhập thể lệ trò chơi..."></textarea>
      <div style="display:flex; justify-content:flex-end; gap:6px; margin-top:12px;">
        <button class="btn" style="background-color:#64748b;" onclick="closeGameModal()">Hủy</button>
        <button class="btn btn-green" onclick="saveGameContent()">Lưu Thay Đổi</button>
      </div>
    </div>
  </div>

<!-- [/PART] -->
